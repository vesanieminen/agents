name: Project status

# Sets the Status field of an issue's card on the user-level project board.
#
# Add a label like `status:ready` to an issue and this moves its board item to
# the matching Status option. The label suffix is matched case-insensitively
# against the option names on the board, so `status:in progress` -> "In Progress".
#
# Projects v2 is GraphQL-only and lives outside the repository. The default
# GITHUB_TOKEN can READ a public project but every write comes back FORBIDDEN
# ("Resource not accessible by integration"), so a fine-grained PAT with
# Projects read/write must be stored as the PROJECTS_TOKEN secret. The
# fallback below exists so a missing secret fails with a clear message rather
# than a confusing permissions error.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to sync
        required: true
      status:
        description: Status option name (e.g. Ready)
        required: true

permissions:
  issues: read
  contents: read

env:
  PROJECT_OWNER: vesanieminen
  PROJECT_NUMBER: "1"
  STATUS_FIELD: Status
  LABEL_PREFIX: "status:"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target status
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "issue=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
            echo "status=$INPUT_STATUS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$LABEL_NAME" in
            "$LABEL_PREFIX"*)
              echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
              echo "status=${LABEL_NAME#"$LABEL_PREFIX"}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Label '$LABEL_NAME' is not a status label; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set board status
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || github.token }}
          USING_PAT: ${{ secrets.PROJECTS_TOKEN != '' }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.target.outputs.issue }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
        run: |
          set -euo pipefail

          if [ "$USING_PAT" = "true" ]; then
            echo "Authenticating with the PROJECTS_TOKEN secret."
          else
            echo "No PROJECTS_TOKEN secret set; falling back to the default GITHUB_TOKEN."
          fi

          # Every failure below is reported against the specific call that
          # failed, so a broken run says which capability is missing rather
          # than just surfacing a bare gh error.
          pat_hint() {
            if [ "$USING_PAT" != "true" ]; then
              echo "::error::The default GITHUB_TOKEN can read a public project but cannot write to one. Create a fine-grained PAT with Projects read/write and store it as the PROJECTS_TOKEN secret."
            fi
          }

          # 1. Read the project, its Status field, and that field's options.
          if ! project=$(gh api graphql -f login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -f field="$STATUS_FIELD" -f query='
            query($login: String!, $number: Int!, $field: String!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  field(name: $field) {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' 2>&1); then
            echo "::error::Could not read project #$PROJECT_NUMBER owned by $PROJECT_OWNER."
            echo "$project"
            pat_hint
            exit 1
          fi

          project_id=$(jq -r '.data.user.projectV2.id' <<<"$project")
          field_id=$(jq -r '.data.user.projectV2.field.id' <<<"$project")
          if [ "$project_id" = "null" ]; then
            echo "::error::Project #$PROJECT_NUMBER owned by $PROJECT_OWNER came back empty. The token can see the API but not this project."
            pat_hint
            exit 1
          fi
          if [ "$field_id" = "null" ]; then
            echo "::error::No single-select field named '$STATUS_FIELD' on the board."
            exit 1
          fi
          echo "Read project #$PROJECT_NUMBER and its $STATUS_FIELD field."

          # Match the label suffix against the option names, case-insensitively.
          option_id=$(jq -r --arg want "$TARGET_STATUS" '
            .data.user.projectV2.field.options[]
            | select((.name | ascii_downcase) == ($want | ascii_downcase))
            | .id' <<<"$project")
          if [ -z "$option_id" ]; then
            echo "::error::'$TARGET_STATUS' is not an option on the $STATUS_FIELD field. Available: $(jq -r '[.data.user.projectV2.field.options[].name] | join(", ")' <<<"$project")"
            exit 1
          fi

          # 2. Resolve the issue's node ID.
          if ! content_id=$(gh api "repos/$REPO/issues/$ISSUE" --jq .node_id 2>&1); then
            echo "::error::Could not read issue #$ISSUE in $REPO."
            echo "$content_id"
            exit 1
          fi
          echo "Resolved issue #$ISSUE."

          # 3. Add the issue to the board. Adding an item that is already
          #    there returns the existing item, so this is idempotent.
          if ! item_id=$(gh api graphql -f project="$project_id" -f content="$content_id" -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                item { id }
              }
            }' --jq '.data.addProjectV2ItemById.item.id' 2>&1); then
            echo "::error::Could not add issue #$ISSUE to the board (addProjectV2ItemById)."
            echo "$item_id"
            pat_hint
            exit 1
          fi
          echo "Board item: $item_id"

          # 4. Set the Status field on that item.
          if ! result=$(gh api graphql -f project="$project_id" -f item="$item_id" -f field="$field_id" -f option="$option_id" -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' 2>&1); then
            echo "::error::Could not set $STATUS_FIELD on the board item (updateProjectV2ItemFieldValue)."
            echo "$result"
            pat_hint
            exit 1
          fi

          echo "Issue #$ISSUE -> $STATUS_FIELD: $TARGET_STATUS"
